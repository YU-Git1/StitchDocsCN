# Stitch 中文文档站 GitHub Pages 部署
name: 部署中文 Stitch 文档站

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传站点构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/stitch-docs-cn
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
